<!DOCTYPE html> 
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>فريق القيادة والتميز - ChromaGrid</title>
  
  <!-- ✅ Preconnect لخادم الصور (يبدأ الاتصال مبكراً) -->
  <link rel="preconnect" href="https://i.postimg.cc" crossorigin>
  <link rel="dns-prefetch" href="https://i.postimg.cc">
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://unpkg.com">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
    body { overflow-x: hidden; min-height: 100vh; min-height: 100dvh; }
    img { max-width: 100%; height: auto; }

    .chroma-grid-container {
      position: relative; width: 100%; min-height: 400px;
      display: flex; justify-content: center; align-items: center;
      border-radius: 1rem; overflow: hidden; background: #08090d;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 640px) {
      .chroma-grid-container { border-radius: 1.5rem; min-height: 520px; }
    }

    .chroma-grid {
      position: relative; width: 100%; height: 100%;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      justify-content: center; gap: 1rem; max-width: 1280px;
      margin: 0 auto; padding: 1.25rem 0.75rem;
      box-sizing: border-box;
      --x: 50%; --y: 50%; --r: 320px;
    }
    @media (min-width: 640px) {
      .chroma-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.25rem; padding: 2rem 1.25rem;
      }
    }
    @media (min-width: 1024px) {
      .chroma-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 280px));
        gap: 1.5rem; padding: 2.5rem 1.5rem;
      }
    }
    @media (max-width: 480px) {
      .chroma-grid {
        grid-template-columns: 1fr; max-width: 100%;
        padding: 1rem 0.75rem; gap: 1rem;
      }
    }

    .chroma-card {
      position: relative; display: flex; flex-direction: column;
      width: 100%; border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      background: var(--card-gradient, linear-gradient(145deg, #18181b, #000));
      z-index: 1; cursor: pointer;
      -webkit-user-select: none; user-select: none;
      --mouse-x: 50%; --mouse-y: 50%;
      --spotlight-color: rgba(255, 255, 255, 0.25);
    }
    @media (min-width: 640px) { .chroma-card { border-radius: 20px; } }

    @media (hover: hover) and (pointer: fine) {
      .chroma-card:hover {
        border-color: var(--card-border, #3b82f6);
        transform: translateY(-6px) scale(1.01);
        box-shadow: 0 16px 35px rgba(0, 0, 0, 0.6);
      }
      .chroma-card:hover::before { opacity: 1; }
      .chroma-card:hover .chroma-img-wrapper img { transform: scale(1.02); }
    }
    .chroma-card:active { transform: scale(0.98); }

    .chroma-card::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), var(--spotlight-color), transparent 70%);
      pointer-events: none; opacity: 0;
      transition: opacity 0.4s ease; z-index: 2;
    }

    /* ===== Image Wrapper ===== */
    .chroma-img-wrapper {
      position: relative; z-index: 1; width: 100%;
      height: 280px;
      padding: 8px; box-sizing: border-box; flex-shrink: 0;
      overflow: hidden;
      background: var(--card-gradient, linear-gradient(145deg, #18181b, #000));
      display: flex; align-items: center; justify-content: center;
    }
    @media (min-width: 480px) { .chroma-img-wrapper { height: 300px; padding: 10px; } }
    @media (min-width: 640px) { .chroma-img-wrapper { height: 320px; padding: 12px; } }
    @media (min-width: 1024px) { .chroma-img-wrapper { height: 340px; } }

    /* ✅ Shimmer placeholder أثناء التحميل */
    .chroma-img-wrapper::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      animation: shimmer 1.6s infinite;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .chroma-img-wrapper.is-loading::after { opacity: 1; }
    .chroma-img-wrapper.is-loaded::after { opacity: 0; animation: none; }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .chroma-img-wrapper img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center;
      border-radius: 10px; display: block;
      transition: transform 0.5s ease, opacity 0.4s ease;
      background: rgba(0, 0, 0, 0.2);
      opacity: 0; /* ✅ يبدأ شفاف */
      position: relative;
      z-index: 1;
    }
    .chroma-img-wrapper img.loaded { opacity: 1; }
    @media (min-width: 640px) {
      .chroma-img-wrapper img { border-radius: 14px; }
    }

    .chroma-info {
      position: relative; z-index: 1;
      padding: 0.85rem 1rem 1rem;
      color: #fff; font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; gap: 0.25rem;
      background: rgba(10, 10, 15, 0.75);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      flex-grow: 1;
    }
    @media (min-width: 640px) {
      .chroma-info { padding: 1.1rem 1.25rem 1.3rem; }
    }

    .chroma-info .name {
      font-size: 0.95rem; font-weight: 700; margin: 0;
      color: #f8fafc; display: flex;
      align-items: center; justify-content: space-between;
      gap: 0.5rem; line-height: 1.4;
    }
    @media (min-width: 640px) { .chroma-info .name { font-size: 1.05rem; } }
    @media (min-width: 1024px) { .chroma-info .name { font-size: 1.15rem; } }

    .chroma-info .name span {
      overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; line-clamp: 2;
    }
    .chroma-info .handle {
      color: #94a3b8; font-size: 0.72rem; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    @media (min-width: 640px) { .chroma-info .handle { font-size: 0.8rem; } }

    .chroma-info .role {
      color: #cbd5e1; font-size: 0.75rem; margin-top: 0.15rem;
      line-height: 1.4; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      line-clamp: 2; overflow: hidden;
    }
    @media (min-width: 640px) { .chroma-info .role { font-size: 0.82rem; } }

    .chroma-contact {
      display: flex; flex-direction: column; gap: 0.35rem;
      margin-top: 0.5rem; padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    @media (min-width: 640px) {
      .chroma-contact { gap: 0.4rem; margin-top: 0.6rem; padding-top: 0.6rem; }
    }

    .chroma-contact-item {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.7rem; color: #94a3b8;
      transition: color 0.2s ease; text-decoration: none;
      min-width: 0; padding: 0.15rem 0; border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    @media (min-width: 640px) {
      .chroma-contact-item { gap: 0.5rem; font-size: 0.75rem; }
    }

    .chroma-contact-item .icon-box {
      display: flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0; transition: all 0.2s ease;
    }
    @media (min-width: 640px) {
      .chroma-contact-item .icon-box { width: 24px; height: 24px; border-radius: 6px; }
    }

    .chroma-contact-item span:last-child {
      direction: ltr; text-align: left;
      font-family: system-ui, -apple-system, sans-serif;
      letter-spacing: 0.01em; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    }

    .chroma-overlay, .chroma-fade {
      position: absolute; inset: 0; pointer-events: none;
    }
    .chroma-overlay {
      z-index: 3;
      backdrop-filter: brightness(0.75); -webkit-backdrop-filter: brightness(0.75);
      background: rgba(0, 0, 0, 0.01);
      mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        transparent 0%, transparent 20%, rgba(0, 0, 0, 0.15) 35%,
        rgba(0, 0, 0, 0.4) 55%, rgba(0, 0, 0, 0.75) 80%, white 100%);
      -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        transparent 0%, transparent 20%, rgba(0, 0, 0, 0.15) 35%,
        rgba(0, 0, 0, 0.4) 55%, rgba(0, 0, 0, 0.75) 80%, white 100%);
    }
    .chroma-fade {
      z-index: 4;
      backdrop-filter: brightness(0.75); -webkit-backdrop-filter: brightness(0.75);
      background: rgba(0, 0, 0, 0.01);
      mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        white 0%, white 20%, rgba(255, 255, 255, 0.8) 40%,
        rgba(255, 255, 255, 0.4) 70%, transparent 100%);
      -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        white 0%, white 20%, rgba(255, 255, 255, 0.8) 40%,
        rgba(255, 255, 255, 0.4) 70%, transparent 100%);
      opacity: 1; transition: opacity 0.35s ease;
    }
    @media (hover: none) {
      .chroma-overlay, .chroma-fade { display: none; }
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-modalPop {
      animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-container {
      max-height: 95vh; max-height: 95dvh;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(96, 165, 250, 0.3) transparent;
    }
    .modal-container::-webkit-scrollbar { width: 6px; }
    .modal-container::-webkit-scrollbar-track { background: transparent; }
    .modal-container::-webkit-scrollbar-thumb {
      background: rgba(96, 165, 250, 0.3); border-radius: 3px;
    }

    @media (max-width: 640px) {
      .modal-container {
        animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        margin: 0; max-height: 92vh; max-height: 92dvh;
      }
    }

    .modal-image-wrap {
      width: 100%;
      height: 320px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      overflow: hidden;
      padding: 4px;
      position: relative;
    }
    .modal-image-wrap::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      animation: shimmer 1.6s infinite;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-image-wrap.is-loading::after { opacity: 1; }
    .modal-image-wrap.is-loaded::after { opacity: 0; animation: none; }

    @media (max-width: 640px) {
      .modal-image-wrap { height: 260px; }
    }
    @media (min-width: 641px) and (max-width: 1023px) {
      .modal-image-wrap { height: 300px; }
    }

    .modal-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border-radius: 10px;
      display: block;
      transition: transform 0.5s ease, opacity 0.3s ease;
      opacity: 0;
      position: relative;
      z-index: 1;
    }
    .modal-image.loaded { opacity: 1; }

    .modal-contact-grid {
      display: grid; grid-template-columns: 1fr;
      gap: 0.6rem; margin-top: 0.5rem;
    }
    @media (min-width: 400px) {
      .modal-contact-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 768px) {
      .modal-contact-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    }

    .modal-contact-card {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.65rem 0.75rem; border-radius: 10px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s ease; text-decoration: none;
      -webkit-tap-highlight-color: transparent; min-width: 0;
    }
    @media (min-width: 640px) {
      .modal-contact-card {
        padding: 0.75rem 0.9rem; border-radius: 12px; gap: 0.6rem;
      }
    }
    .modal-contact-card:active { transform: scale(0.97); }
    @media (hover: hover) {
      .modal-contact-card:hover {
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(30, 41, 59, 0.8);
        transform: translateY(-2px);
      }
      .modal-contact-card:hover .contact-value { color: #93c5fd; }
    }
    .modal-contact-card .contact-icon {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    }
    @media (min-width: 640px) {
      .modal-contact-card .contact-icon {
        width: 36px; height: 36px; border-radius: 10px;
      }
    }
    .modal-contact-card .contact-icon.phone {
      background: rgba(16, 185, 129, 0.12); color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .modal-contact-card .contact-icon.email {
      background: rgba(59, 130, 246, 0.12); color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    .modal-contact-card .contact-text {
      display: flex; flex-direction: column; gap: 0.1rem;
      min-width: 0; flex: 1;
    }
    .modal-contact-card .contact-label {
      font-size: 0.6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em; color: #64748b;
    }
    @media (min-width: 640px) {
      .modal-contact-card .contact-label { font-size: 0.65rem; }
    }
    .modal-contact-card .contact-value {
      font-size: 0.72rem; font-weight: 600; color: #e2e8f0;
      direction: ltr; text-align: left;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; transition: color 0.2s ease;
    }
    @media (min-width: 640px) {
      .modal-contact-card .contact-value { font-size: 0.8rem; }
    }

    .header-container { padding: 1.25rem; border-radius: 1.25rem; }
    @media (min-width: 640px) {
      .header-container { padding: 1.75rem 2rem; border-radius: 1.5rem; }
    }
    .header-logo { height: 2.5rem; width: auto; }
    @media (min-width: 640px) { .header-logo { height: 3rem; } }

    .header-title { font-size: 1.25rem; line-height: 1.3; }
    @media (min-width: 640px) { .header-title { font-size: 1.5rem; } }
    @media (min-width: 1024px) { .header-title { font-size: 1.875rem; } }

    .break-words-safe {
      word-wrap: break-word; overflow-wrap: break-word; word-break: break-word;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans p-3 sm:p-5 md:p-6 lg:p-8 selection:bg-blue-500 selection:text-white">

  <div class="max-w-7xl mx-auto space-y-5 sm:space-y-6 md:space-y-8">
    
    <header class="header-container flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl shadow-xl">
      <div class="space-y-2 flex-1 min-w-0">
        <div class="flex items-center gap-3 sm:gap-4">
          <div class="p-1.5 sm:p-2 bg-slate-950/90 rounded-xl sm:rounded-2xl border border-slate-800 shadow-md flex items-center justify-center flex-shrink-0">
            <img 
              src="https://i.postimg.cc/0yNnvrPk/image.png" 
              alt="شعار الشركة" 
              class="header-logo object-contain rounded-lg sm:rounded-xl"
              width="120" height="48"
              fetchpriority="high"
              onerror="this.style.display='none'"
            />
          </div>
          <h1 class="header-title font-extrabold bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent break-words-safe">
            فريق القيادة والتميز
          </h1>
        </div>
        <p class="text-[11px] sm:text-xs md:text-sm text-slate-400 max-w-xl leading-relaxed mt-1 sm:mt-2 break-words-safe">
          مرّر الماوس لاستكشاف الإضاءة التفاعلية، واضغط على كارت أي عضو لعرض ملفه الشخصي والتفاصيل الكاملة.
        </p>
      </div>

      <div class="relative w-full md:w-72 lg:w-80 flex-shrink-0">
        <i data-lucide="search" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none w-4 h-4"></i>
        <input 
          type="text"
          id="searchInput"
          placeholder="البحث في الأسماء والمناصب..."
          class="w-full bg-slate-950/80 border border-slate-800 rounded-xl sm:rounded-2xl pr-10 pl-4 py-2.5 sm:py-3 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500/80 focus:ring-2 focus:ring-blue-500/20 transition-all shadow-inner"
        />
      </div>
    </header>

    <main class="chroma-grid-container" id="gridContainer">
      <div class="chroma-grid" id="chromaGrid"></div>
      <div class="chroma-overlay" id="chromaOverlay"></div>
      <div class="chroma-fade" id="chromaFade"></div>
    </main>

    <footer class="text-center text-[10px] sm:text-xs text-slate-500 pt-3 sm:pt-4 pb-2">
      جميع الحقوق محفوظة © <span id="yearSpan"></span>
    </footer>

  </div>

  <div id="cardModal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4 bg-black/80 backdrop-blur-md">
    <div class="modal-container bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl max-w-3xl w-full p-4 sm:p-6 text-white shadow-2xl relative overflow-hidden">
      
      <button 
        id="closeModalBtn"
        class="absolute top-3 left-3 sm:top-4 sm:left-4 z-10 text-slate-400 hover:text-white p-2 rounded-full bg-slate-800/90 hover:bg-slate-700 transition-colors border border-slate-700/50 backdrop-blur-sm"
        title="إغلاق"
        aria-label="إغلاق النافذة"
      >
        <i data-lucide="x" class="w-4 h-4 sm:w-5 sm:h-5"></i>
      </button>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 items-start md:items-center pt-8 sm:pt-0">
        
        <div class="relative rounded-xl sm:rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 p-2 sm:p-2.5 flex flex-col justify-center items-center group">
          <div id="modalBgGlow" class="absolute inset-0 opacity-25 pointer-events-none"></div>
          
          <div class="modal-image-wrap relative z-10" id="modalImageWrap">
            <img 
              id="modalImage" 
              src="" 
              alt="" 
              class="modal-image"
              width="400" height="400"
              decoding="async"
            />
          </div>

          <div class="mt-2 sm:mt-3 w-full flex items-center justify-between gap-2 px-1 sm:px-2 text-xs text-slate-400 relative z-10">
            <span id="modalHandle" class="font-mono text-blue-400 font-semibold text-[10px] sm:text-xs truncate" dir="ltr"></span>
            <span class="inline-flex items-center gap-1 px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-full text-[10px] sm:text-[11px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 flex-shrink-0">
              <i data-lucide="shield-check" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i>
              عضو موثق
            </span>
          </div>
        </div>

        <div class="flex flex-col justify-between space-y-3 sm:space-y-4 py-1">
          <div class="space-y-2 sm:space-y-3">
            <div class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1 rounded-full bg-slate-800 text-slate-300 text-[10px] sm:text-xs font-semibold border border-slate-700">
              <i data-lucide="building" class="w-3 h-3 sm:w-3.5 sm:h-3.5 text-blue-400"></i>
              فريق القيادة والإدارة
            </div>

            <h2 id="modalTitle" class="text-lg sm:text-xl md:text-2xl font-bold text-white tracking-wide break-words-safe"></h2>
            <p id="modalSubtitle" class="text-xs sm:text-sm font-semibold text-emerald-400 break-words-safe"></p>

            <div class="w-12 h-0.5 bg-blue-500/50 rounded-full my-1.5 sm:my-2"></div>

            <div class="space-y-1.5 sm:space-y-2">
              <h4 class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400">نبذة مختصرة :</h4>
              <p id="modalDescription" class="text-slate-300 text-xs sm:text-sm leading-relaxed bg-slate-950/70 p-3 sm:p-4 rounded-lg sm:rounded-xl border border-slate-800/80 shadow-inner break-words-safe"></p>
            </div>

            <div class="space-y-1.5 sm:space-y-2">
              <h4 class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400">معلومات التواصل :</h4>
              <div class="modal-contact-grid">
                <a id="modalPhoneLink" href="#" class="modal-contact-card">
                  <div class="contact-icon phone">
                    <i data-lucide="phone" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                  </div>
                  <div class="contact-text">
                    <span class="contact-label">هاتف</span>

          <defs>
            <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:${color};stop-opacity:1" />
              <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
            </linearGradient>
          </defs>
          <rect width="400" height="400" fill="url(#g)"/>
          <circle cx="200" cy="160" r="70" fill="rgba(255,255,255,0.15)"/>
          <text x="200" y="185" font-family="system-ui, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">${initials}</text>
          <text x="200" y="300" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="rgba(255,255,255,0.8)" text-anchor="middle">${name}</text>
        </svg>
      `;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

      }
    ];

    const chromaGrid = document.getElementById('chromaGrid');
    const gridContainer = document.getElementById('gridContainer');
    const chromaFade = document.getElementById('chromaFade');
    const searchInput = document.getElementById('searchInput');
    const yearSpan = document.getElementById('yearSpan');

    const cardModal = document.getElementById('cardModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const closeModalActionBtn = document.getElementById('closeModalActionBtn');
    const modalImage = document.getElementById('modalImage');
    const modalImageWrap = document.getElementById('modalImageWrap');
    const modalBgGlow = document.getElementById('modalBgGlow');
    const modalHandle = document.getElementById('modalHandle');
    const modalTitle = document.getElementById('modalTitle');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const modalDescription = document.getElementById('modalDescription');
    const modalPhone = document.getElementById('modalPhone');
    const modalEmail = document.getElementById('modalEmail');
    const modalPhoneLink = document.getElementById('modalPhoneLink');
    const modalEmailLink = document.getElementById('modalEmailLink');

    yearSpan.textContent = new Date().getFullYear();

    // ✅ Preload cache للصور لتسريع المودال
    const imageCache = new Map();

    function preloadImage(url) {
      if (imageCache.has(url)) return;
      const img = new Image();
      img.decoding = 'async';
      img.src = url;
      imageCache.set(url, img);
    }

    // ===== ✅ Safe image tag with priority + dimensions =====
    function safeImgTag(src, alt, name, color, index = 0) {
      const placeholder = createPlaceholder(name, color);
      const safePlaceholder = placeholder.replace(/"/g, '&quot;');
      const safeSrc = src.replace(/"/g, '&quot;');
      const safeAlt = alt.replace(/"/g, '&quot;');
      
      // ✅ أول 4 صور: eager + high priority | الباقي: lazy
      const isPriority = index < 4;
      const loading = isPriority ? 'eager' : 'lazy';
      const priority = isPriority ? 'high' : 'auto';
      
      return `<img 
        src="${safeSrc}" 
        alt="${safeAlt}" 
        width="400" 
        height="400"
        loading="${loading}"
        fetchpriority="${priority}"
        decoding="async"
        class="card-img"
        data-src="${safeSrc}"
        onerror="this.onerror=null; this.src='${safePlaceholder}';"
      />`;
    }

    function renderCards(items) {
      chromaGrid.innerHTML = '';

      if (items.length === 0) {
        chromaGrid.innerHTML = `
          <div class="col-span-full text-center py-12">
            <i data-lucide="search-x" class="w-10 h-10 mx-auto text-slate-600 mb-3"></i>
            <p class="text-slate-400 text-sm">لا توجد نتائج مطابقة لبحثك</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'chroma-card group';
        card.style.setProperty('--card-border', item.borderColor);
        card.style.setProperty('--card-gradient', item.gradient);

        const imgHTML = safeImgTag(item.image, item.title, item.title, item.borderColor, index);

        card.innerHTML = `
          <div class="chroma-img-wrapper is-loading">
            ${imgHTML}
          </div>
          <footer class="chroma-info">
            <h3 class="name">
              <span>${item.title}</span>
              <i data-lucide="info" class="w-4 h-4 text-slate-400 group-hover:text-blue-400 transition-colors flex-shrink-0"></i>
            </h3>
            <span class="handle" dir="ltr">${item.handle}</span>
            <p class="role">${item.subtitle}</p>

            <div class="chroma-contact">
              <a href="tel:${item.phone.replace(/\s/g, '')}" class="chroma-contact-item" onclick="event.stopPropagation()">
                <span class="icon-box"><i data-lucide="phone" class="w-3 h-3"></i></span>
                <span>${item.phone}</span>
              </a>
              <a href="mailto:${item.email}" class="chroma-contact-item" onclick="event.stopPropagation()">
                <span class="icon-box"><i data-lucide="mail" class="w-3 h-3"></i></span>
                <span>${item.email}</span>
              </a>
            </div>
          </footer>
        `;

        // ✅ ربط تحميل الصورة بـ CSS classes (fade-in + إخفاء shimmer)
        const wrapper = card.querySelector('.chroma-img-wrapper');
        const img = card.querySelector('img.card-img');
        
        if (img) {
          const onLoad = () => {
            wrapper.classList.remove('is-loading');
            wrapper.classList.add('is-loaded');
            img.classList.add('loaded');
          };
          
          // لو الصورة محملة مسبقاً (cache)
          if (img.complete && img.naturalWidth > 0) {
            onLoad();
          } else {
            img.addEventListener('load', onLoad, { once: true });
            img.addEventListener('error', () => {
              wrapper.classList.remove('is-loading');
              wrapper.classList.add('is-loaded');
              img.classList.add('loaded');
            }, { once: true });
          }
        }

        // ✅ Preload للصور الأخرى في الخلفية بعد ظهور أول 4
        if (index >= 4 && index < 8) {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(() => preloadImage(item.image), { timeout: 2000 });
          } else {
            setTimeout(() => preloadImage(item.image), 100);
          }
        }

        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty('--mouse-x', `${x}px`);
          card.style.setProperty('--mouse-y', `${y}px`);
        });

        card.addEventListener('click', (e) => {
          if (e.target.closest('.chroma-contact-item')) return;
          openModal(item);
        });

        chromaGrid.appendChild(card);
      });

      lucide.createIcons();
    }

    const hasHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    if (hasHover) {
      gridContainer.addEventListener('pointermove', (e) => {
        const rect = gridContainer.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        gridContainer.style.setProperty('--x', `${x}px`);
        gridContainer.style.setProperty('--y', `${y}px`);
        if (chromaFade) chromaFade.style.opacity = '0';
      });

      gridContainer.addEventListener('pointerleave', () => {
        if (chromaFade) chromaFade.style.opacity = '1';
      });
    }

    function openModal(item) {
      // ✅ ابدأ shimmer
      modalImageWrap.classList.remove('is-loaded');
      modalImageWrap.classList.add('is-loading');
      modalImage.classList.remove('loaded');

      // ✅ لو الصورة في الـ cache، اعرض فوراً
      const cached = imageCache.get(item.image);
      const finalSrc = cached ? cached.src : item.image;

      modalImage.onload = function() {
        modalImageWrap.classList.remove('is-loading');
        modalImageWrap.classList.add('is-loaded');
        modalImage.classList.add('loaded');
      };
      
      modalImage.onerror = function() {
        this.onerror = null;
        this.src = createPlaceholder(item.title, item.borderColor);
        modalImageWrap.classList.remove('is-loading');
        modalImageWrap.classList.add('is-loaded');
        modalImage.classList.add('loaded');
      };

      modalImage.src = finalSrc;
      modalImage.alt = item.title;

      // لو الصورة محملة مسبقاً
      if (modalImage.complete && modalImage.naturalWidth > 0) {
        modalImageWrap.classList.remove('is-loading');
        modalImageWrap.classList.add('is-loaded');
        modalImage.classList.add('loaded');
      }

      modalBgGlow.style.background = item.gradient;
      modalHandle.textContent = item.handle;
      modalTitle.textContent = item.title;
      modalSubtitle.textContent = item.subtitle;
      modalDescription.textContent = item.description;

      modalPhone.textContent = item.phone;
      modalEmail.textContent = item.email;
      modalPhoneLink.href = `tel:${item.phone.replace(/\s/g, '')}`;
      modalEmailLink.href = `mailto:${item.email}`;

      cardModal.classList.remove('hidden');
      cardModal.classList.add('flex');
      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    function closeModal() {
      cardModal.classList.add('hidden');
      cardModal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    closeModalBtn.addEventListener('click', closeModal);
    closeModalActionBtn.addEventListener('click', closeModal);

    cardModal.addEventListener('click', (e) => {
      if (e.target === cardModal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !cardModal.classList.contains('hidden')) {
        closeModal();
      }
    });

    // ✅ Debounce للبحث (يمنع re-render مع كل حرف)
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = teamMembers.filter(item =>
          item.title.toLowerCase().includes(query) ||
          item.subtitle.toLowerCase().includes(query)
        );
        renderCards(filtered);
      }, 250);
    });

    renderCards(teamMembers);
  </script>
